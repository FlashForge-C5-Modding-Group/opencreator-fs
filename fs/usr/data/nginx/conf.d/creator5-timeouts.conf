# Large uploads and file copies outlast nginx's 60 s defaults on the Creator 5
# and end in a 504. The site's API location sets its own proxy_read_timeout,
# which 20-msmr.sh raises to match.
# After a large upload (100 MB+) this nginx takes over 60 s to hand it to
# Moonraker, and then fails with "upstream timed out while connecting".
proxy_connect_timeout 600s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
client_body_timeout 3600s;
send_timeout 3600s;
