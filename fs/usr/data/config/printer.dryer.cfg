# FlashForge VDS filament dryer on the SoC's /dev/ttyS3 (115200 baud). Not loaded by
# default: the installer writes printer.accessory.dryer.cfg (which includes this file)
# when a dryer answers during the install. To turn it on by hand, add
# [include printer.dryer.cfg] to printer.cfg.
[creator5_dryer]

# Temperatures and times from the VDS "Recommended Drying Temperatures" sticker; where
# it gives a range the top of the range is used. Every macro takes CHAMBER=A|B|AB and
# TEMP/HOURS overrides.
[gcode_macro C5_DRYER_MATERIAL]
description: Dry for a filament type: MATERIAL=PLA|PETG-CF|ASA-CF|PA-CF|PVA|... [CHAMBER=AB]
variable_profiles: {
    "PLA": (55, 8), "PLA-SILK": (55, 8), "PLA-CF": (55, 8),
    "PETG": (70, 8), "PETG-CF": (70, 8), "PETG-PRO": (70, 8),
    "TPU": (70, 12),
    "ABS": (80, 12), "ASA": (80, 12), "PC": (80, 12), "HIPS": (80, 12),
    "ABS-GF": (80, 12), "ABS-CF": (80, 12), "ASA-GF": (80, 12),
    "ASA-CF": (85, 12),
    "PA": (85, 12), "PA-CF": (85, 12), "PAHT-CF": (85, 12), "PET-CF": (85, 12),
    "S-MULTI": (85, 12), "S-PAHT": (85, 12),
    "PPA-CF": (85, 12), "PPS-CF": (85, 12),
    "PVA": (80, 12), "BVOH": (80, 12)
  }
gcode:
  {% set m = params.MATERIAL|default("")|upper|replace("_", "-")|replace(" ", "-") %}
  {% if m not in printer["gcode_macro C5_DRYER_MATERIAL"].profiles %}
    {action_raise_error("Unknown MATERIAL '%s'. Known: %s" % (m, printer["gcode_macro C5_DRYER_MATERIAL"].profiles.keys()|sort|join(", ")))}
  {% endif %}
  {% set p = printer["gcode_macro C5_DRYER_MATERIAL"].profiles[m] %}
  C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP={params.TEMP|default(p[0])|int} HOURS={params.HOURS|default(p[1])}

[gcode_macro C5_DRYER_PLA]
description: Dry for PLA / PLA Silk / PLA-CF (55 C, 8 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=PLA {rawparams}

[gcode_macro C5_DRYER_PETG]
description: Dry for PETG / PETG-CF / PETG Pro (70 C, 8 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=PETG {rawparams}

[gcode_macro C5_DRYER_TPU]
description: Dry for TPU (70 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=TPU {rawparams}

[gcode_macro C5_DRYER_ABS]
description: Dry for ABS / ASA / PC / HIPS / ABS-GF / ABS-CF / ASA-GF (80 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=ABS {rawparams}

[gcode_macro C5_DRYER_ASA_CF]
description: Dry for ASA-CF (85 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=ASA-CF {rawparams}

[gcode_macro C5_DRYER_PA]
description: Dry for PA / PA-CF / PAHT-CF / PET-CF / S-Multi / S-PAHT (85 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=PA {rawparams}

[gcode_macro C5_DRYER_PPA]
description: Dry for PPA-CF / PPS-CF (85 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=PPA-CF {rawparams}

[gcode_macro C5_DRYER_PVA]
description: Dry for PVA / BVOH (80 C, 12 h)
gcode:
  C5_DRYER_MATERIAL MATERIAL=PVA {rawparams}

[gcode_macro C5_DRYER_OFF]
description: Stop drying in both chambers
gcode:
  C5_DRYER_STOP CHAMBER=AB
