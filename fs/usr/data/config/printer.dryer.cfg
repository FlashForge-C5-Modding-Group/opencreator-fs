# FlashForge VDS filament dryer on the SoC's /dev/ttyS3 (115200 baud). Not loaded by
# default: the installer writes printer.accessory.dryer.cfg (which includes this file)
# when a dryer answers during the install. To turn it on by hand, add
# [include printer.dryer.cfg] to printer.cfg.
[creator5_dryer]

# Temperatures and times from the VDS "Recommended Drying Temperatures" sticker; where
# it gives a range the top of the range is used. Every macro takes CHAMBER=A|B|AB and
# TEMP/HOURS overrides.
[gcode_macro C5_DRYER_MATERIAL]
description: Dry for a filament type: MATERIAL=PLA|PETG-CF|ASA-CF|PA-CF|PVA|... [CHAMBER=AB]
variable_profiles: {
    "PLA": (55, 8), "PLA-SILK": (55, 8), "PLA-CF": (55, 8),
    "PETG": (70, 8), "PETG-CF": (70, 8), "PETG-PRO": (70, 8),
    "TPU": (70, 12),
    "ABS": (80, 12), "ASA": (80, 12), "PC": (80, 12), "HIPS": (80, 12),
    "ABS-GF": (80, 12), "ABS-CF": (80, 12), "ASA-GF": (80, 12),
    "ASA-CF": (85, 12),
    "PA": (85, 12), "PA-CF": (85, 12), "PAHT-CF": (85, 12), "PET-CF": (85, 12),
    "S-MULTI": (85, 12), "S-PAHT": (85, 12),
    "PPA-CF": (85, 12), "PPS-CF": (85, 12),
    "PVA": (80, 12), "BVOH": (80, 12)
  }
gcode:
  {% set m = params.MATERIAL|default("")|upper|replace("_", "-")|replace(" ", "-") %}
  {% if m not in printer["gcode_macro C5_DRYER_MATERIAL"].profiles %}
    {action_raise_error("Unknown MATERIAL '%s'. Known: %s" % (m, printer["gcode_macro C5_DRYER_MATERIAL"].profiles.keys()|sort|join(", ")))}
  {% endif %}
  {% set p = printer["gcode_macro C5_DRYER_MATERIAL"].profiles[m] %}
  C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP={params.TEMP|default(p[0])|int} HOURS={params.HOURS|default(p[1])}

[gcode_macro C5_DRYER_PLA]
description: Dry for PLA / PLA Silk / PLA-CF (55 C, 8 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=PLA CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_PETG]
description: Dry for PETG / PETG-CF / PETG Pro (70 C, 8 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=PETG CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_TPU]
description: Dry for TPU (70 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=TPU CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_ABS]
description: Dry for ABS / ASA / PC / HIPS / ABS-GF / ABS-CF / ASA-GF (80 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=ABS CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_ASA_CF]
description: Dry for ASA-CF (85 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=ASA-CF CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_PA]
description: Dry for PA / PA-CF / PAHT-CF / PET-CF / S-Multi / S-PAHT (85 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=PA CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_PPA]
description: Dry for PPA-CF / PPS-CF (85 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=PPA-CF CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

[gcode_macro C5_DRYER_PVA]
description: Dry for PVA / BVOH (80 C, 12 h) [CHAMBER=A|B|AB]
gcode:
  C5_DRYER_MATERIAL MATERIAL=PVA CHAMBER={params.CHAMBER|default("AB")}{% if params.TEMP %} TEMP={params.TEMP}{% endif %}{% if params.HOURS %} HOURS={params.HOURS}{% endif %}

# The dryer's own commands, as macros of the same name so Fluidd lists them (with their
# fields): rename_existing moves each command to _C5_DRYER_<name>.
[gcode_macro C5_DRYER_START]
rename_existing: _C5_DRYER_START
description: Dry with your own settings: CHAMBER=A|B|AB TEMP=45-85 HOURS=1-48 (or MINUTES=60-2880)
gcode:
  {% if params.MINUTES %}
    _C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP={params.TEMP|default(50)|int} MINUTES={params.MINUTES|int}
  {% else %}
    _C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP={params.TEMP|default(50)|int} HOURS={params.HOURS|default(8)}
  {% endif %}

[gcode_macro C5_DRYER_STATUS]
rename_existing: _C5_DRYER_STATUS
description: Show each chamber's state, temperature, humidity and time left
gcode:
  _C5_DRYER_STATUS

[gcode_macro C5_DRYER_PAUSE]
rename_existing: _C5_DRYER_PAUSE
description: Pause drying (heaters off) [CHAMBER=A|B|AB]; resume with C5_DRYER_START
gcode:
  _C5_DRYER_PAUSE CHAMBER={params.CHAMBER|default("AB")}

[gcode_macro C5_DRYER_DEHUMIDIFY]
rename_existing: _C5_DRYER_DEHUMIDIFY
description: Keep a chamber dry after drying [CHAMBER=A|B|AB] [ENABLE=0|1]
gcode:
  _C5_DRYER_DEHUMIDIFY CHAMBER={params.CHAMBER|default("AB")} ENABLE={params.ENABLE|default(1)|int}

[gcode_macro C5_DRYER_OFF]
description: Stop drying [CHAMBER=A|B|AB]
gcode:
  _C5_DRYER_STOP CHAMBER={params.CHAMBER|default("AB")}

[gcode_macro C5_DRYER_STOP]
rename_existing: _C5_DRYER_STOP
description: Stop drying [CHAMBER=A|B|AB]
gcode:
  _C5_DRYER_STOP CHAMBER={params.CHAMBER|default("AB")}
