# FlashForge VDS filament dryer on the SoC's /dev/ttyS3 (115200 baud). Not loaded by
# default: the installer writes printer.accessory.dryer.cfg (which includes this file)
# when a dryer answers during the install. To turn it on by hand, add
# [include printer.dryer.cfg] to printer.cfg.
[creator5_dryer]

[gcode_macro C5_DRYER_PLA]
description: Dry both chambers for PLA (50 C, 6 h)
gcode:
  C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP=50 HOURS=6

[gcode_macro C5_DRYER_PETG]
description: Dry both chambers for PETG (65 C, 6 h)
gcode:
  C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP=65 HOURS=6

[gcode_macro C5_DRYER_ABS]
description: Dry both chambers for ABS/ASA (80 C, 6 h)
gcode:
  C5_DRYER_START CHAMBER={params.CHAMBER|default("AB")} TEMP=80 HOURS=6

[gcode_macro C5_DRYER_OFF]
description: Stop drying in both chambers
gcode:
  C5_DRYER_STOP CHAMBER=AB
