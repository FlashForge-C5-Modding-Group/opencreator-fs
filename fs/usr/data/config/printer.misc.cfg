# Creator 5 print preparation controls. Flow calibration and purge are virtual
# Misc switches like AFC Quiet Mode; bed leveling is a session macro switch.
# Tune switches are saved so they also apply to the next printer startup.
[save_variables]
filename: /usr/data/config/c5_misc_variables.cfg

[gcode_macro C5_MISC]
description: Show pre-print and tune switches
variable_bed_leveling: 1
gcode:
  {% set saved = printer.save_variables.variables %}
  { action_respond_info("Flow calibration: %s; purge: %s; bed leveling: %s; startup tune: %s; print-start tune: %s" %
    ("ON" if printer["filament_switch_sensor flow_calibration"].enabled else "OFF",
     "ON" if printer["filament_switch_sensor purge"].enabled else "OFF",
     "ON" if printer["gcode_macro C5_MISC"].bed_leveling else "OFF",
     "ON" if saved.c5_startup_tune|default(1)|int else "OFF",
     "ON" if saved.c5_print_start_tune|default(1)|int else "OFF")) }

[gcode_macro C5_MISC_BED_LEVEL_ON]
description: Enable fresh bed mesh calibration before each print
gcode:
  SET_GCODE_VARIABLE MACRO=C5_MISC VARIABLE=bed_leveling VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_LEVEL_OFF]
description: Use saved bed mesh without recalibrating before each print
gcode:
  SET_GCODE_VARIABLE MACRO=C5_MISC VARIABLE=bed_leveling VALUE=0
  C5_MISC

[gcode_macro C5_MISC_STARTUP_TUNE_ON]
description: Enable the startup tune, including after reboot
gcode:
  SAVE_VARIABLE VARIABLE=c5_startup_tune VALUE=1
  C5_MISC

[gcode_macro C5_MISC_STARTUP_TUNE_OFF]
description: Disable the startup tune, including after reboot
gcode:
  SAVE_VARIABLE VARIABLE=c5_startup_tune VALUE=0
  C5_MISC

[gcode_macro C5_MISC_PRINT_TUNE_ON]
description: Enable the print-start tune
gcode:
  SAVE_VARIABLE VARIABLE=c5_print_start_tune VALUE=1
  C5_MISC

[gcode_macro C5_MISC_PRINT_TUNE_OFF]
description: Disable the print-start tune
gcode:
  SAVE_VARIABLE VARIABLE=c5_print_start_tune VALUE=0
  C5_MISC

[gcode_macro BEEP]
description: Sound the buzzer; DURATION in ms, FREQUENCY in Hz, LEVEL 0-100
variable_duration: 5000
variable_frequency: 2500
variable_level: 100
gcode:
  {% set defaults = printer['gcode_macro BEEP'] %}
  C5_BUZZER DURATION={params.DURATION|default(defaults.duration)} FREQUENCY={params.FREQUENCY|default(defaults.frequency)} LEVEL={params.LEVEL|default(defaults.level)} OPTIONAL={params.OPTIONAL|default(0)}

[delayed_gcode C5_STARTUP_TUNE_DELAY]
initial_duration: 2
gcode:
  C5_STARTUP_TUNE

[gcode_macro C5_STARTUP_TUNE]
description: Play the Creator 5 startup melody when enabled in Misc
gcode:
  {% if printer.save_variables.variables.c5_startup_tune|default(1)|int %}
    BEEP DURATION=120 FREQUENCY=523 OPTIONAL=1
    BEEP DURATION=120 FREQUENCY=659 OPTIONAL=1
    BEEP DURATION=240 FREQUENCY=784 OPTIONAL=1
  {% endif %}

[gcode_macro C5_PRINT_START_TUNE]
description: Play the Creator 5 print-start melody when enabled in Misc
gcode:
  {% if printer.save_variables.variables.c5_print_start_tune|default(1)|int %}
    BEEP DURATION=100 FREQUENCY=523 OPTIONAL=1
    BEEP DURATION=100 FREQUENCY=659 OPTIONAL=1
    BEEP DURATION=100 FREQUENCY=784 OPTIONAL=1
    BEEP DURATION=250 FREQUENCY=1047 OPTIONAL=1
  {% endif %}

# Stock print preparation tests PA/flow with alternating slow and fast strokes
# about 8 mm above the bed before the separate normal purge and cooldown.
[gcode_macro C5_FLOW_CALIBRATION]
description: Measure stock-style alternating-speed strokes before purge and cooldown
gcode:
  C5_FLOW_STROKES
