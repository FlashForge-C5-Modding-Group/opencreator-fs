##
## Customization:
##   1) copy the gcode_macro _CLIENT_VARIABLE (see below) to your printer.cfg
##   2) remove the comment mark (#) from all lines
##   3) change any value in there to your needs
##
## Use the PAUSE macro direct in your M600:
##  e.g. with a different park position front left and a minimal height of 50 
##    [gcode_macro M600]
##    description: Filament change
##    gcode: PAUSE X=10 Y=10 Z_MIN=50
##  Z_MIN will park the toolhead at a minimum of 50 mm above to bed to make it easier for you to swap filament.
##
## Client variable macro for your printer.cfg
#[gcode_macro _CLIENT_VARIABLE]
#variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
#variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
#variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
#variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
#variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
#variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
#variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
#variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
#gcode:

# The bed never moves up here. Before any travel it goes down z_clearance
# below the paused height (AFC, which wraps PAUSE and RESUME, has already
# lowered it by its z_hop; this tops that up). RESUME brings it back up. The
# head parks at the purge spot via X/Y prep_approach, and the nozzles cool
# until RESUME.
# Print by object (Orca print_sequence): the finished objects can be taller
# than the one being printed, so the bed goes down to z_clearance above the
# tallest of them instead, if that is lower. RESUME crosses back at that
# height and only then brings the bed up.
# REASON=runout: C5_FILAMENT_RUNOUT moves the head and keeps the heaters.
# REASON=motion: skipped steps, X/Y can't be trusted, so no park.
[gcode_macro PAUSE]
description: Pause, retract and park without raising the bed
rename_existing: PAUSE_BASE
variable_retract: 2.0
variable_retract_speed: 35
variable_pause_temp: 40
variable_idle_timeout: 36000
variable_z_clearance: 2.0
gcode:
  {% if not printer.pause_resume.is_paused %}
    {% set reason = params.REASON|default('')|lower %}
    {% set tc = printer.creator5_toolchanger %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set tool = tc.active_tool if tc.active_tool is not none else -1 %}
    {% set extruder = printer.toolhead.extruder %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set sd = printer.virtual_sdcard %}
    {% set ns = namespace(temps=[]) %}
    {% for index in range(4) %}
      {% set ns.temps = ns.temps + [printer['extruder' if index == 0 else 'extruder' ~ index].target|float] %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=state VALUE="{{ 'reason': reason, 'tool': tool, 'temps': ns.temps, 'fan': printer['fan_generic fanM106'].speed|float, 'x': pos.x, 'y': pos.y }}"
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=parked VALUE=False
    PAUSE_BASE
    {% if extruder != '' and printer[extruder].can_extrude %}
      SAVE_GCODE_STATE NAME=C5_PAUSE_RETRACT
      M83
      G1 E-{retract} F{retract_speed * 60}
      RESTORE_GCODE_STATE NAME=C5_PAUSE_RETRACT MOVE=0
    {% endif %}
    {% if 'z' in homed %}
      # Down only, and short of the Z limit (G-code Z is the nozzle height
      # above the bed for every tool)
      {% set settings = printer.configfile.settings %}
      {% set afc_hop = settings.afc.z_hop|float if 'afc' in settings else 0.0 %}
      {% set clear_z = pos.z - afc_hop + z_clearance %}
      {% if sd.print_by_object %}
        {% set clear_z = [clear_z, sd.print_max_z + z_clearance]|max %}
      {% endif %}
      {% set top = printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z - 1 %}
      {% set clear_z = [clear_z, top]|min %}
      {% if clear_z > pos.z %}
        SAVE_GCODE_STATE NAME=C5_PAUSE_CLEAR
        G90
        G1 Z{'%.3f' % clear_z} F{printer.configfile.settings.printer.max_z_velocity * 60}
        RESTORE_GCODE_STATE NAME=C5_PAUSE_CLEAR MOVE=0
      {% endif %}
    {% endif %}
    {% if reason != 'runout' %}
      # Before the park, so a failed park doesn't leave a hot nozzle on the print
      {% for index in range(4) %}
        {% if ns.temps[index] > pause_temp %}
          SET_HEATER_TEMPERATURE HEATER={'extruder' if index == 0 else 'extruder' ~ index} TARGET={pause_temp}
        {% endif %}
      {% endfor %}
      M107
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}
    {% if reason != 'runout' %}
      {% set why = 'skipped steps, X/Y not trusted' if reason == 'motion'
              else 'not homed' if 'x' not in homed or 'y' not in homed or 'z' not in homed
              else 'no tool attached' if tool < 0
              else 'tool sensor error' if tc.sensor_error
              else 'toolchanger busy' if tc.busy
              else 'head is beside the docks' if printer.gcode_move.gcode_position.x > tc.prep_approach_x
              else '' %}
      {% if why %}
        RESPOND MSG="Paused in place: {why}"
      {% else %}
        C5_MOVE_TO_PURGE_BUCKET
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=parked VALUE=True
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 125.0
variable_custom_park_y: 10.0
variable_custom_park_dz: 5.0
variable_park_at_cancel: False
gcode:

# Reheat and purge at the purge spot, at PAUSE's lowered height (or at Z10
# after X/Y homing), then go back to the print through X/Y prep_approach. RESUME_BASE's restore and AFC never
# move the extruder; they only carry the file's E on. So the purge's own retract
# (purge_retract) is primed back here. It replaces the 2 mm pause retract,
# which the purge used up. PURGE_LENGTH= and PURGE_SPEED= override the purge.
[gcode_macro RESUME]
description: Reheat, purge at the paused height, then return to the print
rename_existing: RESUME_BASE
variable_purge_length: 20
variable_state: {}
variable_parked: False
gcode:
  {% set tc = printer.creator5_toolchanger %}
  {% if not printer.pause_resume.is_paused or not state %}
    RESUME_BASE VELOCITY={params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity)|float}
  {% else %}
    # Back to the print at tool-change travel speed
    {% set velocity = params.VELOCITY|default(tc.travel_speed)|float %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'z' not in homed %}
      { action_raise_error("Z lost its position while paused (motors turned off?). The print can't resume; cancel it.") }
    {% elif tc.sensor_error %}
      { action_raise_error("Tool sensors report an error: %s" % tc.sensor_error) }
    {% elif tc.active_tool is none %}
      { action_raise_error("No tool attached. Pick up %s before resuming." % ('T%d' % state.tool if state.tool >= 0 else 'a tool')) }
    {% elif state.tool >= 0 and tc.active_tool != state.tool %}
      { action_raise_error("T%d is attached but the print paused with T%d. Swap back before resuming." % (tc.active_tool, state.tool)) }
    {% endif %}
    {% set rehome = 'x' not in homed or 'y' not in homed or state.reason == 'motion' %}
    {% if rehome %}
      # Lowers the bed to Z10 first if it is higher; the return to the print
      # brings it back up to the paused height
      G28 X Y
    {% endif %}
    {% if rehome or (not parked and state.reason != 'runout') %}
      # Reheat over the purge spot, not over the print
      C5_MOVE_TO_PURGE_BUCKET
    {% endif %}
    {% for index in range(4) %}
      {% if state.temps[index] > 0 %}
        SET_HEATER_TEMPERATURE HEATER={'extruder' if index == 0 else 'extruder' ~ index} TARGET={state.temps[index]}
      {% endif %}
    {% endfor %}
    {% for index in range(4) %}
      {% if state.temps[index] > 0 %}
        TEMPERATURE_WAIT SENSOR={'extruder' if index == 0 else 'extruder' ~ index} MINIMUM={state.temps[index] - 2}
      {% endif %}
    {% endfor %}
    C5_TOOL_PURGE LENGTH={params.PURGE_LENGTH|default(purge_length)|float}{% if 'PURGE_SPEED' in params %} SPEED={params.PURGE_SPEED|float}{% endif %}
    _C5_RESUME_FAN_BLAST
    C5_LEAVE_PURGE_BUCKET
    SAVE_GCODE_STATE NAME=C5_RESUME_PRIME
    M83
    G1 E{tc.purge_retract} F300
    RESTORE_GCODE_STATE NAME=C5_RESUME_PRIME MOVE=0
    {% if printer.virtual_sdcard.print_by_object and 'x' in state %}
      # Print by object: cross to the paused X/Y at PAUSE's clearance height,
      # so RESUME_BASE only has to bring the bed up
      SAVE_GCODE_STATE NAME=C5_RESUME_CROSS
      G90
      G1 X{'%.3f' % state.x} Y{'%.3f' % state.y} F{tc.travel_speed * 60}
      RESTORE_GCODE_STATE NAME=C5_RESUME_CROSS MOVE=0
    {% endif %}
    SET_FAN_SPEED FAN=fanM106 SPEED={state.fan}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    RESUME_BASE VELOCITY={velocity}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=state VALUE="{ {} }"
  {% endif %}

# Hardens the purged strand so it drops off the nozzle before the head leaves.
[gcode_macro _C5_RESUME_FAN_BLAST]
description: Part fan at full for a few seconds after the resume purge
variable_seconds: 3
gcode:
  SET_FAN_SPEED FAN=fanM106 SPEED=1
  G4 P{(seconds * 1000)|int}

[respond]

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}
  
##### internal use #####
[gcode_macro _CLIENT_EXTRUDE]
description: Extrudes, if the extruder is hot enough
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set use_fw_retract = (client.use_fw_retract|default(false)|lower == 'true') and (printer.firmware_retraction is defined) %}
  {% set length = params.LENGTH|default(client.unretract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_unretract)|default(35) %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  ##### end of definitions #####
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      {% if use_fw_retract %}
        {% if length < 0 %}
          G10
        {% else %}
          G11
        {% endif %}
      {% else %}
        M83
        G1 E{length} F{(speed|float|abs) * 60}
        {% if absolute_extrude %}
          M82
        {% endif %}
      {% endif %}
    {% else %}
      RESPOND TYPE=echo MSG='{"\"%s\" not hot enough" % printer.toolhead.extruder}'
    {% endif %}
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Retracts, if the extruder is hot enough
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set length = params.LENGTH|default(client.retract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_retract)|default(35) %}

  _CLIENT_EXTRUDE LENGTH=-{length|float|abs} SPEED={speed|float|abs}

[gcode_macro _CLIENT_LINEAR_MOVE]
description: Linear move with save and restore of the gcode state
gcode:
  {% set x_move = "X" ~ params.X if params.X is defined else "" %}
  {% set y_move = "Y" ~ params.Y if params.Y is defined else "" %}
  {% set z_move = "Z" ~ params.Z if params.Z is defined else "" %}
  {% set e_move = "E" ~ params.E if params.E is defined else "" %}
  {% set rate = "F" ~ params.F if params.F is defined else "" %}
  {% set ABSOLUTE = params.ABSOLUTE | default(0) | int != 0 %}
  {% set ABSOLUTE_E = params.ABSOLUTE_E | default(0) | int != 0 %}
  SAVE_GCODE_STATE NAME=_client_movement
  {% if x_move or y_move or z_move %}
    G9{ 0 if ABSOLUTE else 1 }
  {% endif %}
  {% if e_move %}
    M8{ 2 if ABSOLUTE_E else 3 }
  {% endif %}
  G1 { x_move } { y_move } { z_move } { e_move } { rate }
  RESTORE_GCODE_STATE NAME=_client_movement