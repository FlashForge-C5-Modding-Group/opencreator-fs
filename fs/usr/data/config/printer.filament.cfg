
# The four filament presence switches are owned by AFC_extruder in
# printer.afc-standalone.cfg.  Keep motion encoders here.

[filament_motion_sensor fm_ex0]
switch_pin: !eheaterboard:PA15
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     { action_respond_info("wheel runout:T0") }
insert_gcode:
     { action_respond_info("wheel insert:T0") }

[filament_motion_sensor fm_ex1]
switch_pin: !eheaterboard:PB13
detection_length: 50
extruder: extruder1
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     { action_respond_info("wheel runout:T1") }
insert_gcode:
     { action_respond_info("wheel insert:T1") }

[filament_motion_sensor fm_ex2]
switch_pin: !eheaterboard:PB11
detection_length: 50
extruder: extruder2
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     { action_respond_info("wheel runout:T2") }
insert_gcode:
     { action_respond_info("wheel insert:T2") }

[filament_motion_sensor fm_ex3]
switch_pin: !eheaterboard:PB12
detection_length: 50
extruder: extruder3
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     { action_respond_info("wheel runout:T3") }
insert_gcode:
     { action_respond_info("wheel insert:T3") }

# Standalone AFC tracks filament at each pin_tool_start; insertion into the
# tool is manual. This first phase selects and heats the requested tool.
[gcode_macro C5_PREPARE_FILAMENT_LOAD]
description: Select and heat a tool before manually inserting filament
gcode:
  {% set tool = params.TOOL|default(-1)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% if tool < 0 or tool > 3 or temp < 150 or temp > 300 %}
    { action_raise_error("Use TOOL=0..3 and a safe TEMP=150..300") }
  {% endif %}
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("Pause the print before loading filament") }
  {% endif %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% if printer.pause_resume.is_paused %}
    C5_CHECK_LOAD_TOOL T={tool}
  {% else %}
    AFC_SELECT_TOOL TOOL={heater}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  C5_FILAMENT_LOAD_READY

[gcode_macro C5_FILAMENT_LOAD_READY]
description: Report that a tool is hot and ready for manual filament insertion
gcode:
  { action_respond_info("Tool is hot. Ensure filament is inserted and detected by AFC; run C5_LOAD_FILAMENT LENGTH=20 only if more feed/purge is needed.") }

[gcode_macro C5_LOAD_FILAMENT]
description: Feed manually inserted filament through the selected hot tool
gcode:
  {% set length = params.LENGTH|default(20)|float %}
  {% set heater = printer.toolhead.extruder %}
  {% if length <= 0 or length > 80 %}
    { action_raise_error("LENGTH must be greater than 0 and at most 80 mm") }
  {% endif %}
  {% if heater not in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    { action_raise_error("Select a Creator 5 AFC tool before loading") }
  {% endif %}
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("Pause the print before feeding filament") }
  {% endif %}
  {% if not printer[heater].can_extrude %}
    { action_raise_error("Heat the selected tool before feeding filament") }
  {% endif %}
  C5_CHECK_LOAD_TOOL
  {% if printer.pause_resume.is_paused %}
    # Feed in place: do not move across the print or replace PAUSE's saved state.
    SAVE_GCODE_STATE NAME=C5_PAUSED_LOAD
    M83
    G1 E{length} F180
    RESTORE_GCODE_STATE NAME=C5_PAUSED_LOAD MOVE=0
  {% else %}
    C5_TOOL_PURGE LENGTH={length}
  {% endif %}

[gcode_macro C5_PREPARE_LOAD_T0]
description: Select and heat T0 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=0 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T1]
description: Select and heat T1 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=1 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T2]
description: Select and heat T2 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=2 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T3]
description: Select and heat T3 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=3 TEMP={params.TEMP|default(220)|float}
