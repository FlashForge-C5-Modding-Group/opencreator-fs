# Pop-up menus for the touchscreen (GrumpyScreen Console -> Macros) and the web
# UIs. They use Klipper's action:prompt dialogs, so Fluidd and Mainsail show the
# same menus. Each menu only opens a dialog; the work is done by the existing
# OpenCreator macros its buttons run.

# Shared: close whatever dialog is open.
[gcode_macro _MENU_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

# Shared: close the dialog, then run CMD.
[gcode_macro _MENU_RUN]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {params.CMD}

# Shared: not homed. Offer to home, then reopen the menu that asked
# (MENU=name; TEMP is passed back to LOAD_MENU).
[gcode_macro _MENU_NEED_HOME]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Not homed"
  RESPOND TYPE=command MSG="action:prompt_text The printer needs homing first. Home now? The menu opens again afterwards."
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_footer_button Home|_MENU_HOME_THEN MENU={params.MENU}{% if 'TEMP' in params %} TEMP={params.TEMP}{% endif %}|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _MENU_HOME_THEN]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G28
  {params.MENU}{% if 'TEMP' in params %} TEMP={params.TEMP}{% endif %}

# ---------------------------------------------------------------------------
# On/off options: the dialog shows the option's state and offers only the
# opposite action.
# ---------------------------------------------------------------------------
[gcode_macro _OPT_MENU]
description: Pop-up showing one option's state with only the opposite action
gcode:
  {% set titles = {'flow_calibration': 'Flow calibration', 'purge': 'Purge',
                   'purge_line': 'Purge line', 'bed_leveling': 'Bed mesh',
                   'clog_detection': 'Clog detection', 'lower_bed_on_end': 'Lower bed',
                   'quiet_mode': 'Quiet mode', 'chamber_wait': 'Chamber wait',
                   'door_notify': 'Door notify'} %}
  {% set pin = params.PIN %}
  {% if ("output_pin " ~ pin) not in printer %}
    { action_raise_error("Unknown option " ~ pin) }
  {% endif %}
  {% set title = titles[pin]|default(pin) %}
  {% set on = printer["output_pin " ~ pin].value|int == 1 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {title} is {'ON' if on else 'OFF'}"
  {% if on %}
    RESPOND TYPE=command MSG="action:prompt_button Turn {title} OFF|_OPT_SET PIN={pin} VALUE=0|primary"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_button Turn {title} ON|_OPT_SET PIN={pin} VALUE=1|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _OPT_SET]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_PIN PIN={params.PIN} VALUE={params.VALUE|int}
  C5_MISC

[gcode_macro FLOW_MENU]
description: Flow calibration on/off pop-up
gcode:
  _OPT_MENU PIN=flow_calibration

[gcode_macro PURGE_MENU]
description: Purge on/off pop-up
gcode:
  _OPT_MENU PIN=purge

[gcode_macro PURGELINE_MENU]
description: Purge line on/off pop-up
gcode:
  _OPT_MENU PIN=purge_line

[gcode_macro MESH_MENU]
description: Fresh bed mesh before each print on/off pop-up
gcode:
  _OPT_MENU PIN=bed_leveling

[gcode_macro CLOG_MENU]
description: Clog detection on/off pop-up
gcode:
  _OPT_MENU PIN=clog_detection

[gcode_macro LOWERBED_MENU]
description: Lower bed at print end on/off pop-up
gcode:
  _OPT_MENU PIN=lower_bed_on_end

[gcode_macro QUIET_MENU]
description: Quiet mode on/off pop-up
gcode:
  _OPT_MENU PIN=quiet_mode

[gcode_macro CHAMBERWAIT_MENU]
description: Chamber wait on/off pop-up
gcode:
  _OPT_MENU PIN=chamber_wait

[gcode_macro DOORNOTIFY_MENU]
description: Door notify on/off pop-up
gcode:
  _OPT_MENU PIN=door_notify

# ---------------------------------------------------------------------------
# Bed soak: on/off plus the soak time. The time is saved as bed_soak_minutes;
# print start passes it to C5_BED_SOAK, which otherwise uses the
# [creator5_toolchanger] bed_soak_minutes default.
# ---------------------------------------------------------------------------
[gcode_macro SOAK_MENU]
description: Bed soak on/off and soak time
gcode:
  {% set on = printer["output_pin bed_soak"].value|int == 1 %}
  {% set sv = printer.save_variables.variables %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Soak is {'ON' if on else 'OFF'}"
  {% if on %}
    {% if sv.bed_soak_minutes is defined %}
      RESPOND TYPE=command MSG="action:prompt_text Soak time: {sv.bed_soak_minutes} min"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Soak time: config default"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Change time|_SOAK_TIME_MENU|primary"
    RESPOND TYPE=command MSG="action:prompt_button Turn Soak OFF|_SOAK_OFF|primary"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_button Turn Soak ON|_SOAK_TIME_MENU|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SOAK_TIME_MENU]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Soak time"
  RESPOND TYPE=command MSG="action:prompt_text Minutes at bed temperature before the mesh. Picking one turns Soak ON."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button 2 min|_SOAK_SET MIN=2|primary"
  RESPOND TYPE=command MSG="action:prompt_button 5 min|_SOAK_SET MIN=5|primary"
  RESPOND TYPE=command MSG="action:prompt_button 10 min|_SOAK_SET MIN=10|primary"
  RESPOND TYPE=command MSG="action:prompt_button 15 min|_SOAK_SET MIN=15|primary"
  RESPOND TYPE=command MSG="action:prompt_button 20 min|_SOAK_SET MIN=20|primary"
  RESPOND TYPE=command MSG="action:prompt_button 30 min|_SOAK_SET MIN=30|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SOAK_SET]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SAVE_VARIABLE VARIABLE=bed_soak_minutes VALUE={params.MIN|int}
  C5_MISC_BED_SOAK_ON
  RESPOND MSG="Soak ON, {params.MIN|int} min"

[gcode_macro _SOAK_OFF]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  C5_MISC_BED_SOAK_OFF

# ---------------------------------------------------------------------------
# Load filament and dock position: pick a tool.
# ---------------------------------------------------------------------------
[gcode_macro LOAD_MENU]
description: Pick a tool to load filament (TEMP=hotend temperature, default 220)
gcode:
  {% set temp = params.TEMP|default(220)|int %}
  {% set ha = printer.toolhead.homed_axes %}
  {% if "x" not in ha or "y" not in ha %}
    _MENU_NEED_HOME MENU=LOAD_MENU TEMP={temp}
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Load filament"
  RESPOND TYPE=command MSG="action:prompt_text Insert filament into the tool, then tap it."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for t in range(4) %}
    RESPOND TYPE=command MSG="action:prompt_button T{t}|_LOAD_PICK T={t} TEMP={temp}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro CAL_DOCK_MENU]
description: Pick a tool for dock position calibration
gcode:
  {% set ha = printer.toolhead.homed_axes %}
  {% if "x" not in ha or "y" not in ha %}
    _MENU_NEED_HOME MENU=CAL_DOCK_MENU
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Dock position calibration"
  RESPOND TYPE=command MSG="action:prompt_text Tools docked and cool. Pick the tool to calibrate."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for t in range(4) %}
    RESPOND TYPE=command MSG="action:prompt_button T{t}|_CAL_DOCK_PICK T={t}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _LOAD_PICK]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  C5_LOAD_FILAMENT TOOL={params.T|int} TEMP={params.TEMP|default(220)|int}

[gcode_macro _CAL_DOCK_PICK]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  C5_CALIBRATE_TOOL_POSITION T={params.T|int}

# Tool offsets: OC's offset wizard (C5_CALIBRATE_OFFSETS with no parameters),
# after homing if needed.
[gcode_macro TOOL_OFFSETS_MENU]
description: Tool offset calibration wizard, homing first if needed
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Not while printing") }
  {% endif %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    _MENU_NEED_HOME MENU=TOOL_OFFSETS_MENU
  {% else %}
    C5_CALIBRATE_OFFSETS
  {% endif %}

# ---------------------------------------------------------------------------
# Level + Save: pick a bed temperature, then a soak time, then probe a full
# mesh and save it as the default profile (Klipper restarts on save).
# ---------------------------------------------------------------------------
[gcode_macro LEVEL_SAVE]
description: Home, optionally heat and soak, probe a fresh bed mesh and save it as default (BED=temp MINUTES=soak)
gcode:
  {% set bed = params.BED|default(0)|float %}
  {% set mins = params.MINUTES|default(0)|float %}
  {% set was = printer["output_pin bed_soak"].value|int %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Not while printing") }
  {% endif %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  {% if bed > 0 %}
    M190 S{bed}
    {% if mins > 0 %}
      # C5_BED_SOAK only soaks while the Soak option is on.
      {% if not was %}
        C5_MISC_BED_SOAK_ON
      {% endif %}
      C5_BED_SOAK MINUTES={mins}
      {% if not was %}
        C5_MISC_BED_SOAK_OFF
      {% endif %}
    {% endif %}
  {% endif %}
  BED_MESH_CALIBRATE PROFILE=default
  SAVE_CONFIG

[gcode_macro LEVEL_SAVE_MENU]
description: Level + Save: pick the bed temperature
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Not while printing") }
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Level and save"
  RESPOND TYPE=command MSG="action:prompt_text Bed temperature for the mesh? Klipper restarts when it is saved."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Cold|_LEVEL_SAVE_TEMP BED=0|primary"
  {% for b in [50, 60, 80, 100] %}
    RESPOND TYPE=command MSG="action:prompt_button {b} C|_LEVEL_SAVE_TEMP BED={b}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LEVEL_SAVE_TEMP]
description: Level + Save: pick the soak time (or confirm a cold run)
gcode:
  {% set bed = params.BED|default(0)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if bed > 0 %}
    RESPOND TYPE=command MSG="action:prompt_begin Level at {bed} C"
    RESPOND TYPE=command MSG="action:prompt_text Soak time before probing? Picking one starts the run."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button No soak|_LEVEL_SAVE_GO BED={bed} MIN=0|primary"
    {% for m in [2, 5, 10, 20] %}
      RESPOND TYPE=command MSG="action:prompt_button {m} min|_LEVEL_SAVE_GO BED={bed} MIN={m}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Level cold"
    RESPOND TYPE=command MSG="action:prompt_text Probe with the bed as it is, no heating or soak."
    RESPOND TYPE=command MSG="action:prompt_button Start|_LEVEL_SAVE_GO BED=0 MIN=0|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LEVEL_SAVE_GO]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  LEVEL_SAVE BED={params.BED|default(0)|int} MINUTES={params.MIN|default(0)|int}

