# Creator 5 host-side toolchanger.  The initial positions below come from
# Config::initExtruderConfig in the factory firmwareExe.i64.  Measure and save
# the actual positions on this printer before unattended toolchanges.
[creator5_toolchanger]
door_buttons: topDoor, frontDoor
safe_z: 10
approach_x: 250
pre_dock_x: 280
pullback: 20
max_mount_correction: 2
max_offset_correction: 3
# Extruder Position Calibrate: manual alignment timeout, hand-release pause,
# and reduced acceleration for the automatic endstop measurements.
position_calibration_timeout: 30
position_calibration_release_wait_ms: 5000
position_calibration_accel: 1000

t0_dock_x: 298.219
t0_dock_y: 56.472
t1_dock_x: 298.605
t1_dock_y: 107.100
t2_dock_x: 298.200
t2_dock_y: 156.920
t3_dock_x: 298.238
t3_dock_y: 207.140

# Factory initial calibration measurements, not printer G-code offsets.
t0_measure_x: 15.800
t0_measure_y: 215.280
t0_measure_z: 1.460
t1_measure_x: 15.820
t1_measure_y: 215.280
t1_measure_z: 1.467
t2_measure_x: 15.550
t2_measure_y: 216.085
t2_measure_z: 1.406
t3_measure_x: 15.864
t3_measure_y: 215.340
t3_measure_z: 1.437

# Levelboard circular calibration target (factory extruder config).
station_x: 28.815
station_y: 215.097
tool_fixture_shift_x: -12.5
scan_span: 7
# Set only after measuring the fixture height on this printer.
# scan_height: 1.7
# Optional XY-only scan height override. Full calibration probes Z first and
# scans XY 0.6 mm above each measured contact height, as in stock firmware.
z_probe_target: -8
extruder_json_path: /usr/data/firmwareRes/config/extruder.json
zoffset_json_path: /usr/data/firmwareRes/config/zoffset.json

# Stock nozzle-preparation area: X=265+1.5, Y=9+4.8.
purge_x: 266.5
purge_y: 13.8
purge_z: 1.0
purge_length: 12
purge_speed: 3

[gcode_macro C5_PRINT_START]
description: Heat, home, select a Creator 5 tool, then purge at preparation area
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set bed = params.BED|default(0)|float %}
  {% set hotend = params.HOTEND|default(0)|float %}
  {% set flow = params.FLOW_CALIBRATION|default(printer['gcode_macro C5_MISC'].flow_calibration)|int %}
  {% set level = params.BED_LEVELING|default(printer['gcode_macro C5_MISC'].bed_leveling)|int %}
  {% if tool < 0 or tool > 3 or hotend <= 0 %}
    { action_raise_error("C5_PRINT_START needs TOOL=0..3 and HOTEND>0") }
  {% endif %}
  {% if flow not in [0, 1] or level not in [0, 1] %}
    { action_raise_error("FLOW_CALIBRATION and BED_LEVELING must be 0 or 1") }
  {% endif %}
  C5_HOME_FOR_PRINT
  C5_PRINT_START_TUNE
  STEPPER_RESONANCE_DAMP_ENABLE
  M140 S{bed}
  {% if bed > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed}
  {% endif %}
  BED_MESH_CLEAR
  {% if level %}
    BED_MESH_CALIBRATE
  {% elif 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
  {% endif %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  AFC_SELECT_TOOL TOOL={heater}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={hotend}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={hotend - 2}
  {% if flow %}
    C5_FLOW_CALIBRATION
  {% endif %}
  C5_TOOL_PURGE
  G90
  M82

[gcode_macro C5_PRINT_STOP]
description: Stop heating and park the selected Creator 5 tool
gcode:
  M400
  TURN_OFF_HEATERS
  M107
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' in homed and 'y' in homed and 'z' in homed %}
    AFC_UNSELECT_TOOL
  {% endif %}
  M84

[gcode_macro C5_PREPARE_MACHINE]
description: Home XY and dock an attached head; leave the build plate installed
gcode:
  C5_RECOVER_ATTACHED

[gcode_macro C5_CALIBRATE_OFFSETS]
description: Measure one or all AFC tool offsets with the levelboard
gcode:
  {% set requested = params.TOOL|default('')|upper %}
  {% set z = params.Z|default(1)|int %}
  {% set save = params.SAVE|default(1)|int %}
  {% if params.BUILDPLATE_REMOVED|default(0)|int != 1 %}
    { action_raise_error("Remove the build plate before offset calibration. Once removed, rerun C5_CALIBRATE_OFFSETS with BUILDPLATE_REMOVED=1") }
  {% endif %}
  {% if z not in [0, 1] or save not in [0, 1] %}
    { action_raise_error("Z and SAVE must be 0 or 1") }
  {% endif %}
  {% if z == 1 and 'SCAN_Z' in params %}
    { action_raise_error("Automatic Z probing sets the XY scan height; omit SCAN_Z") }
  {% endif %}
  {% if z == 0 and 'SCAN_Z' not in params and 'scan_height' not in printer.configfile.settings.creator5_toolchanger %}
    { action_raise_error("XY-only calibration needs scan_height or SCAN_Z=<height>") }
  {% endif %}
  {% if requested == 'ALL' %}
    {% if z != 1 %}
      { action_raise_error("TOOL=ALL requires automatic Z probing (Z=1)") }
    {% endif %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
      { action_raise_error("Home XYZ before all-tool offset calibration") }
    {% endif %}
    C5_CALIBRATE_ALL_OFFSETS SAVE={save} BUILDPLATE_REMOVED=1
  {% else %}
    {% if requested not in ['0', '1', '2', '3'] %}
      { action_raise_error("Specify TOOL=0..3 for a mounted head, or TOOL=ALL") }
    {% endif %}
    {% set tool = requested|int %}
    {% if 'SCAN_Z' in params %}
      C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} SCAN_Z={params.SCAN_Z|float} BUILDPLATE_REMOVED=1
    {% else %}
      C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} BUILDPLATE_REMOVED=1
    {% endif %}
    {% if save %}
      C5_SAVE_OFFSETS_JSON
    {% endif %}
  {% endif %}
