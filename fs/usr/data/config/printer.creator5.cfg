# Creator 5 host-side toolchanger.  The initial positions below come from
# Config::initExtruderConfig in the factory firmwareExe.i64.  Measure and save
# the actual positions on this printer before unattended toolchanges.
[creator5_toolchanger]
door_buttons: topDoor, frontDoor
safe_z: 10
# Toolchange travel profile requested for this machine; contact moves retain
# their separate lower speeds below.
pickup_accel: 30000
clear_travel_speed: 600
clearance_z_speed: 60
dock_approach_speed: 60
pickup_predock_speed: 60
pickup_latch_speed: 60
pullback_speed: 80
# Pull away from the latch slowly for 20 mm, then clear the remaining
# pullback at the unobstructed travel speed before verification/activation.
pullback_slow_distance: 20
departure_speed: 80
pickup_departure_speed: 600
# Reinstate full rated travel acceleration after a successful pickup so the
# first move toward the print does not inherit a lower prior limit.
post_select_accel: 30000
# No fixed toolchange pauses: motor motion and M400 still synchronize where
# required, and the physical dock/grab switches remain authoritative.
release_latch_wait_ms: 0
pickup_latch_wait_ms: 0
toolchange_sensor_settle_ms: 0
approach_x: 250
pre_dock_x: 280
pullback: 60
max_mount_correction: 2
max_offset_correction: 3
# Extruder Position Calibrate: manual alignment timeout, hand-release pause,
# and reduced acceleration for the automatic endstop measurements.
position_calibration_timeout: 30 # In seconds
position_calibration_release_wait_ms: 5000
position_calibration_accel: 1000

t0_dock_x: 298.219
t0_dock_y: 56.472
t1_dock_x: 298.605
t1_dock_y: 107.100
t2_dock_x: 298.200
t2_dock_y: 156.920
t3_dock_x: 298.238
t3_dock_y: 207.140

# Factory initial calibration measurements, not printer G-code offsets.
t0_measure_x: 15.800
t0_measure_y: 215.280
t0_measure_z: 1.460
t1_measure_x: 15.820
t1_measure_y: 215.280
t1_measure_z: 1.467
t2_measure_x: 15.550
t2_measure_y: 216.085
t2_measure_z: 1.406
t3_measure_x: 15.864
t3_measure_y: 215.340
t3_measure_z: 1.437

# Levelboard circular calibration target (factory extruder config).
station_x: 28.815
station_y: 215.097
tool_fixture_shift_x: -12.5
scan_span: 7
# Set only after measuring the fixture height on this printer.
# scan_height: 1.7
# Optional XY-only scan height override. Full calibration probes Z first and
# scans XY 0.6 mm above each measured contact height, as in stock firmware.
z_probe_target: -8
# Stock touchscreen checkPlatformRemove() uses the ordinary [probe] pin at
# X43/Y226 and test.json cylinder_x/y before levelboard offset measurement.
plate_check_x: 43
plate_check_y: 226
plate_check_min_delta: 0.8
extruder_json_path: /usr/data/firmwareRes/config/extruder.json
zoffset_json_path: /usr/data/firmwareRes/config/zoffset.json
test_json_path: /usr/data/firmwareRes/config/test.json

# Rear-right bucket; approach it from X250/Y250 to clear the docks.
prep_approach_x: 250
prep_approach_y: 250
purge_x: 270
purge_y: 260
purge_z: 8.0
# After purging, return via X250/Y250 before front cooldown and docking.
cooldown_x: 266.5
cooldown_y: 13.8
cooldown_wipe_z: 2.0
cooldown_lift_z: 10.0
cooldown_fan_speed: 0.6
purge_length: 50
purge_speed: 3
flow_test_z: 8.0
# Five-millimetre X sweep
flow_sweep_x: 5.0
# Fold stock 20/40 mm strokes into a 5 mm bucket sweep without shrinking
# their extrusion pulses or durations (stock 18/183 mm/s at 5000 accel).
flow_test_accel: 625
flow_slow_speed: 4.5
flow_fast_speed: 22.875
flow_verdict_settle_ms: 50
flow_calibration_default: True
purge_default: True
# Misc switch: lower the bed to physical Z max after docking at print end.
lower_bed_on_end_default: False
lower_bed_speed: 10

# Prime all four tools before printing. Each must have filament and a fitted
# nozzle; HOTEND0..3 can override the shared HOTEND material temperature.
[gcode_macro C5_PRINT_START]
description: Home, optionally prepare T0-T3, mesh, check Z, then print
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set bed = params.BED|default(0)|float %}
  {% set hotend = params.HOTEND|default(0)|float %}
  {% set first_layer = params.FIRST_LAYER_HEIGHT|default(0.2)|float %}
  {% set flow = params.FLOW_CALIBRATION|default(printer['filament_switch_sensor flow_calibration'].enabled)|int %}
  {% set purge = params.PURGE|default(printer['filament_switch_sensor purge'].enabled)|int %}
  {% set level = params.BED_LEVELING|default(printer['gcode_macro C5_MISC'].bed_leveling)|int %}
  {% if tool < 0 or tool > 3 or hotend <= 0 or first_layer <= 0 %}
    { action_raise_error("C5_PRINT_START needs TOOL=0..3 and HOTEND>0") }
  {% endif %}
  {% if flow not in [0, 1] or purge not in [0, 1] or level not in [0, 1] %}
    { action_raise_error("FLOW_CALIBRATION, PURGE and BED_LEVELING must be 0 or 1") }
  {% endif %}
  {% set tool_temps = [params.HOTEND0|default(hotend)|float,
                       params.HOTEND1|default(hotend)|float,
                       params.HOTEND2|default(hotend)|float,
                       params.HOTEND3|default(hotend)|float] %}
  {% if tool_temps|min <= 0 %}
    { action_raise_error("HOTEND0..HOTEND3 must be positive when priming all tools") }
  {% endif %}
  C5_HOME_FOR_PRINT
  C5_PRINT_START_TUNE
  STEPPER_RESONANCE_DAMP_ENABLE
  M140 S{bed}
  {% if bed > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed}
  {% endif %}
  {% if flow or purge %}
  {% for index in range(4) %}
    {% set prime_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
    {% set prime_temp = tool_temps[index] %}
    AFC_SELECT_TOOL TOOL={prime_heater}
    C5_AUTO_NOZZLE_Z T={index} HOTEND={prime_temp} BED={bed} FIRST_LAYER_HEIGHT={first_layer}
    SET_HEATER_TEMPERATURE HEATER={prime_heater} TARGET={prime_temp}
    TEMPERATURE_WAIT SENSOR={prime_heater} MINIMUM={prime_temp - 2}
    {% if flow %}
      C5_FLOW_CALIBRATION
    {% endif %}
    {% if purge %}
      C5_TOOL_PURGE
    {% endif %}
    C5_COOL_FOR_DOCK HOTEND={prime_temp}
    AFC_UNSELECT_TOOL
  {% endfor %}
  {% endif %}
  BED_MESH_CLEAR
  {% if level %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% elif 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
  {% endif %}
  C5_CENTER_Z_CHECK
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% set print_temp = tool_temps[tool] %}
  AFC_SELECT_TOOL TOOL={heater}
  C5_AUTO_NOZZLE_Z T={tool} HOTEND={print_temp} BED={bed} FIRST_LAYER_HEIGHT={first_layer}
  C5_VERIFY_NOZZLE_Z
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={print_temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={print_temp - 2}
  C5_VERIFY_NOZZLE_Z
  G90
  M82

[gcode_macro C5_CENTER_Z_CHECK]
description: Probe bed center after meshing; does not change nozzle Z offset
gcode:
  {% set probe = printer.configfile.settings.probe %}
  SAVE_GCODE_STATE NAME=c5_center_z_check
  G90
  G1 Z5 F600
  G1 X{125 - probe.x_offset} Y{125 - probe.y_offset} F6000
  PROBE
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=c5_center_z_check MOVE=0

[gcode_macro C5_PURGE_LINE]
description: Prime the selected hot tool with a line on the bed
gcode:
  {% set heater = printer.toolhead.extruder %}
  {% if heater not in ['extruder', 'extruder1', 'extruder2', 'extruder3'] or not printer[heater].can_extrude %}
    { action_raise_error('Select and heat a Creator 5 tool before the purge line') }
  {% endif %}
  C5_VERIFY_NOZZLE_Z
  SAVE_GCODE_STATE NAME=c5_purge_line
  G90
  M83
  G1 Z5 F900
  G1 X20 Y10 F6000
  G1 Z0.3 F600
  G1 X180 E5.98 F1200
  G1 E-0.8 F1200
  G1 Z5 F900
  RESTORE_GCODE_STATE NAME=c5_purge_line MOVE=0

[gcode_macro C5_PRINT_STOP]
description: Stop heating, park the tool, optionally lower the bed
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [10.0, room]|min %}
  M400
  TURN_OFF_HEATERS
  M107
  {% if 'x' in homed and 'y' in homed and 'z' in homed %}
    {% if hop > 0 %}
      SAVE_GCODE_STATE NAME=C5_END_HOP
      G91
      G1 Z{hop} F600
      RESTORE_GCODE_STATE NAME=C5_END_HOP MOVE=0
    {% endif %}
    AFC_UNSELECT_TOOL
  {% endif %}
  {% if 'z' in homed and printer['filament_switch_sensor lower_bed_on_end'].enabled %}
    C5_LOWER_BED
  {% endif %}
  M400
  M84

[gcode_macro PAUSE]
description: Pause in place and lower the bed without crossing the parked heads
rename_existing: PAUSE_BASE
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set requested = params.Z_HOP|default(5)|float %}
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [requested, room]|min %}
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
    {% if 'z' in homed and hop > 0 %}
      SAVE_GCODE_STATE NAME=C5_PAUSE_HOP
      G91
      G1 Z{hop} F600
      RESTORE_GCODE_STATE NAME=C5_PAUSE_HOP MOVE=0
    {% endif %}
  {% endif %}

[gcode_macro RESUME]
description: Return from the Z-only pause hop to the saved print position
rename_existing: RESUME_BASE
gcode:
  {% set requested = params.VELOCITY|default(10)|float %}
  {% set velocity = [[requested, 1]|max, 10]|min %}
  RESUME_BASE VELOCITY={velocity}

[gcode_macro C5_PREPARE_MACHINE]
description: Home XY and dock an attached head; leave the build plate installed
gcode:
  C5_RECOVER_ATTACHED

[gcode_macro C5_CALIBRATE_OFFSETS]
description: Calibrate tool offsets; ALL first verifies the stock pin
gcode:
  {% set requested = params.TOOL|default('')|upper %}
  {% set z = params.Z|default(1)|int %}
  {% set save = params.SAVE|default(1)|int %}
  {% if params.BUILDPLATE_REMOVED|default(0)|int != 1 %}
    { action_raise_error("Remove the build plate before offset calibration. Once removed, rerun C5_CALIBRATE_OFFSETS with BUILDPLATE_REMOVED=1") }
  {% endif %}
  {% if z not in [0, 1] or save not in [0, 1] %}
    { action_raise_error("Z and SAVE must be 0 or 1") }
  {% endif %}
  {% if z == 1 and 'SCAN_Z' in params %}
    { action_raise_error("Automatic Z probing sets the XY scan height; omit SCAN_Z") }
  {% endif %}
  {% if z == 0 and 'SCAN_Z' not in params and 'scan_height' not in printer.configfile.settings.creator5_toolchanger %}
    { action_raise_error("XY-only calibration needs scan_height or SCAN_Z=<height>") }
  {% endif %}
  {% if requested == 'ALL' %}
    {% if z != 1 %}
      { action_raise_error("TOOL=ALL requires automatic Z probing (Z=1)") }
    {% endif %}
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
      { action_raise_error("Home XYZ before all-tool offset calibration") }
    {% endif %}
    C5_CALIBRATE_ALL_OFFSETS SAVE={save} BUILDPLATE_REMOVED=1
  {% else %}
    {% if requested not in ['0', '1', '2', '3'] %}
      { action_raise_error("Specify TOOL=0..3 for a mounted head, or TOOL=ALL") }
    {% endif %}
    {% set tool = requested|int %}
    {% if 'SCAN_Z' in params %}
      C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} SCAN_Z={params.SCAN_Z|float} BUILDPLATE_REMOVED=1
    {% else %}
      C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} BUILDPLATE_REMOVED=1
    {% endif %}
    {% if save %}
      C5_SAVE_OFFSETS_JSON
    {% endif %}
  {% endif %}
